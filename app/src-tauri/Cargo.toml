[package]
name = "zipkoo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zipkoo desktop app"

[lib]
name = "zipkoo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["direct"]
# Downloaded from our site: self-updates.
direct = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
# Mac App Store build: the store handles updates; sandbox-safe features only.
appstore = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zipkoo-core = { path = "../../crates/zipkoo-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2.1"
trash = "5"
tauri-plugin-notification = "2.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
