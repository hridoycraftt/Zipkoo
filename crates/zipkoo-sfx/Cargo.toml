[package]
name = "zipkoo-sfx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stub program for Zipkoo self-extracting archives"

[[bin]]
name = "zipkoo-sfx"
path = "src/main.rs"

[dependencies]
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
tinyfiledialogs = "3.9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
zipkoo-core = { path = "../zipkoo-core" }
tempfile = "3"
