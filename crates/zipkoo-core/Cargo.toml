[package]
name = "zipkoo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zip = "9.5"
sevenz-rust2 = { version = "0.25", features = ["zstd"] }
zstd = { version = "0.13", features = ["zstdmt"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
liblzma = { version = "0.4", features = ["static"] }
unrar = "0.5"
walkdir = "2"
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
fs4 = "1.1"

[dev-dependencies]
tempfile = "3"
walkdir = "2"
zip = "9.5"
