[package]
name = "zipkoo-share-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stores end-to-end encrypted Zipkoo shares. It never sees keys or file names."

[lib]
path = "src/lib.rs"

[[bin]]
name = "zipkoo-share-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
zipkoo-core = { path = "../zipkoo-core" }
tempfile = "3"
