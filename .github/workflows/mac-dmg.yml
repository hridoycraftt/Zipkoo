name: Mac DMG (test build)

# Run by hand (Actions → Mac DMG → Run workflow). Builds one universal DMG (Apple silicon + Intel)
# and keeps it as a workflow artifact for 14 days. Nothing is published or released.
# Without an Apple Developer ID it is only ad-hoc signed: the first open needs right-click → Open.
on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Build universal DMG
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: "-"
          # The DMG's app checks for signed updates; the build signs its update files with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Check the app inside the DMG
        run: |
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          hdiutil attach "$DMG" -mountpoint /tmp/zk -nobrowse -readonly
          lipo -archs /tmp/zk/Zipkoo.app/Contents/MacOS/Zipkoo
          plutil -extract CFBundleDocumentTypes json -o - /tmp/zk/Zipkoo.app/Contents/Info.plist
          codesign --verify --deep --verbose=2 /tmp/zk/Zipkoo.app
          ls /tmp/zk
          hdiutil detach /tmp/zk
      - uses: actions/upload-artifact@v4
        with:
          name: Zipkoo-mac-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
